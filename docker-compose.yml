services:
  mikrotik-dns:
    container_name: mikrotik-dns
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5354:5354/udp"
    volumes:
      - ./data:/data
    environment:
      RETENTION: ${RETENTION:-7d}
      DNS_SERVER: ${DNS_SERVER:-}
      # Optional RouterOS REST API access for device names and router stats.
      MIKROTIK_URL: ${MIKROTIK_URL:-}
      MIKROTIK_USER: ${MIKROTIK_USER:-}
      MIKROTIK_PASSWORD: ${MIKROTIK_PASSWORD:-}
      MIKROTIK_INSECURE: ${MIKROTIK_INSECURE:-false}
      TZ: ${TZ:-UTC}
